server:
  port: 8080
  servlet:
    context-path: /cdr-generator

spring:
  application:
    name: cdr-generator1

app:
  cdr:
    data-structure-path: "src/main/resources/datastructure.json"
    default-record-count: 1
    max-record-count: 100

    ai:
      enabled: true
      provider: gemini
      timeout-ms: 30000
      max-retries: 2
      retry-backoff-ms: 1000
      max-fields-per-request: 80
      batch-size: 20

      gemini:
        base-url: "https://generativelanguage.googleapis.com/v1beta"
        model: "gemini-3.5-flash-lite"
        api-key: ${GEMINI_API_KEY:}
        temperature: 0.9

      # Eslesme: alan adi kucuk harfe cevrilir, 'match' ifadelerinden birini
      # iceriyorsa kural uygulanir. ILK eslesen kazanir; ozel kurallar once yazilir.
      field-rules:

        - name: callingNumber
          match: [ "msisdn", "anumber", "callingnumber", "callingparty", "servedmsisdn", "subscribernumber" ]
          description: "Turkiye GSM abone numarasi; operator kodu 50x, 53x, 54x, 55x veya 56x"
          pattern: "^(\\+?90|0)?5(0|3|4|5|6)[0-9]{8}$"
          examples: [ "05301234567", "905343545097", "05559876543" ]

        - name: calledNumber
          match: [ "bnumber", "callednumber", "calledparty", "destinationnumber", "dialledparty", "requestedparty", "recipient" ]
          description: "Aranan numara; Turkiye GSM (5xx) veya sabit hat (2xx, 3xx, 4xx)"
          pattern: "^(\\+?90|0)?(5(0|3|4|5|6)[0-9]{8}|(2|3|4)[0-9]{9})$"
          examples: [ "905010983255", "02121234567", "05321112233" ]

        - name: currency
          match: [ "currency" ]
          description: "ISO 4217 sayisal para birimi kodu"
          pattern: "^[0-9]{3}$"
          examples: [ "949", "978", "840" ]

        - name: shortNumber
          match: [ "shortnumber", "smscshortnumber", "servicenumber" ]
          description: "Kisa servis numarasi, 3 ile 5 hane arasi"
          pattern: "^[0-9]{3,5}$"
          examples: [ "7979", "2525" ]

        - name: imsi
          match: [ "imsi", "imsicurrent", "imsinew" ]
          description: "Turkiye MCC 286 ve MNC 01-04 ile baslayan 15 haneli IMSI"
          pattern: "^286(01|02|03|04)[0-9]{10}$"
          examples: [ "286016640426689", "286012345678901" ]

        - name: imei
          match: [ "imei", "equipmentid" ]
          description: "15 haneli cihaz kimligi"
          pattern: "^[0-9]{15}$"
          examples: [ "353908156170760" ]

        - name: millisecondsFraction
          match: [ "fraction" ]
          description: "Milliseconds ::= INTEGER (0..999): saniyenin kesri, TAM ZAMAN DEGIL. 0-999 arasi duz sayi."
          pattern: "^[0-9]{1,3}$"
          examples: [ "0", "125", "999" ]

        - name: timestamp
          match: [ "timestamp", "starttime", "endtime", "openingtime", "closuretime", "eventtime", "triggertime" ]
          description: "14 hane ise yyyyMMddHHmmss, 12 hane ise yyMMddHHmmss; 2026 icinde son 30 gun"
          pattern: "^[0-9]{12,14}$"
          examples: [ "20260711050243", "260711050243" ]

        - name: date
          match: [ "date", "receiveddate", "expirydate", "startdate" ]
          description: "yyyyMMdd formatinda tarih"
          pattern: "^[0-9]{8}$"
          examples: [ "20260711" ]

        - name: duration
          match: [ "duration", "callduration" ]
          description: "Saniye cinsinden sure; sesli cagri icin 1-3600 arasi"
          pattern: "^[0-9]{1,6}$"
          examples: [ "15", "127", "842" ]

        - name: volume
          match: [ "volume", "octets", "uplink", "downlink", "datavolume" ]
          description: "Byte cinsinden veri hacmi"
          pattern: "^[0-9]{1,12}$"
          examples: [ "1048576", "52428800" ]

        - name: ipAddress
          match: [ "ipaddress", "ipv4", "sgsnaddress", "ggsnaddress", "pdpaddress", "gsnaddress" ]
          description: "Ozel ag IPv4 adresi"
          pattern: "^(10|172|192)\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$"
          examples: [ "10.219.22.197" ]

        - name: accessPointName
          match: [ "accesspointname", "apn" ]
          description: "Erisim noktasi adi (APN)"
          pattern: "^[a-zA-Z0-9.]+$"
          examples: [ "internet", "mms.turkcell.com.tr", "ims" ]

        - name: pdpType
          match: [ "pdptype" ]
          description: "PDP tipi kodu"
          pattern: "^(IP|PPP|IPV6|IPV4V6)$"
          examples: [ "IP", "IPV6" ]

        - name: cellId
          match: [ "cellid", "cellidentifier", "locationarea", "trackingarea" ]
          description: "Sabit uzunlukta sifir dolgulu hucre veya alan kimligi"
          pattern: "^[0-9]{4,10}$"
          examples: [ "41253", "00000" ]

        - name: latitude
          match: [ "latitude" ]
          description: "Turkiye sinirlari icinde enlem, 35.8 ile 42.1 arasi"
          pattern: "^(3[5-9]|4[0-2])\\.[0-9]{1,6}$"
          examples: [ "41.015137", "38.423733" ]

        - name: longitude
          match: [ "longitude" ]
          description: "Turkiye sinirlari icinde boylam, 25.9 ile 44.8 arasi"
          pattern: "^(2[6-9]|3[0-9]|4[0-4])\\.[0-9]{1,6}$"
          examples: [ "28.979530", "35.243322" ]

        - name: ipAddress
          match: [ "ipaddress", "ipv4" ]
          description: "Ozel ag IPv4 adresi"
          pattern: "^(10|172|192)\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$"
          examples: [ "10.219.22.197" ]

        - name: hostName
          match: [ "hostname", "originhostname", "domainname" ]
          description: "Sunucu veya alan adi"
          pattern: "^[a-zA-Z0-9.-]+$"
          examples: [ "host01.turkcell.com.tr", "ims.mnc001.mcc286.3gppnetwork.org" ]

        - name: booleanFlag
          match: [ "flag", "realmoneyflag", "isvowifi", "isvideo", "welcomestatus" ]
          description: "0 veya 1 degerinde sayisal bayrak"
          pattern: "^(0|1)$"
          examples: [ "0", "1" ]

        - name: sequenceNumber
          match: [ "sequence", "sequencenumber", "recordnumber", "localsequencenumber" ]
          description: "Artan sira numarasi"
          pattern: "^[0-9]{1,10}$"
          examples: [ "295043" ]

logging:
  level:
    com.turkcell.cdrgenerator1: DEBUG
  file:
    name: logs/cdr-generator.log

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs