server:
  port: 8080
  servlet:
    context-path: /cdr-generator

spring:
  application:
    name: cdr-generator1

app:
  cdr:
    data-structure-path: "src/main/resources/datastructure.json"
    default-record-count: 1
    max-record-count: 100

    # IMPLICIT tag'li CHOICE (OPTIONAL) alanlari uretime katma. Encoder onlari
    # X.680 30.6'ya gore dogru (EXPLICIT) uretir ama EMM cozucusu bunu yanlis
    # okuyup "Duplicate Tag" reddi veriyor (Ericsson TR). EMM duzelince false yap.
    skip-implicit-choice-fields: true

    # Uretilen BER'in, onu ureten alan agacina gore geri okunup dogrulanmasi.
    # strict: ERROR bulgusu varsa dosya dondurulmez | warn: loglanir, dosya doner | off: kapali
    self-check:
      mode: strict
      rules:
        duplicate-tag: true
        set-ordering: true
        tag-shape: true
        named-number: true
        integer-range: true

    ai:
      enabled: true
      provider: gemini
      timeout-ms: 30000
      max-retries: 2
      retry-backoff-ms: 1000
      max-fields-per-request: 80
      batch-size: 20

      gemini:
        base-url: "https://generativelanguage.googleapis.com/v1beta"
        model: "gemini-3.5-flash-lite"
        api-key: ${GEMINI_API_KEY:}
        temperature: 0.9

      # Eslesme: alan adi kucuk harfe cevrilir, 'match' ifadelerinden birini
      # iceriyorsa kural uygulanir. ILK eslesen kazanir; ozel kurallar once yazilir.
      field-rules:

        - name: callingNumber
          match: [ "msisdn", "anumber", "callingnumber", "callingparty", "servedmsisdn", "subscribernumber" ]
          description: "Turkiye GSM abone numarasi; operator kodu 50x, 53x, 54x, 55x veya 56x"
          pattern: "^(\\+?90|0)?5(0|3|4|5|6)[0-9]{8}$"
          examples: [ "05301234567", "905343545097", "05559876543" ]

        - name: calledNumber
          match: [ "bnumber", "callednumber", "calledparty", "destinationnumber", "dialledparty", "requestedparty", "recipient" ]
          description: "Aranan numara; Turkiye GSM (5xx) veya sabit hat (2xx, 3xx, 4xx)"
          pattern: "^(\\+?90|0)?(5(0|3|4|5|6)[0-9]{8}|(2|3|4)[0-9]{9})$"
          examples: [ "905010983255", "02121234567", "05321112233" ]

        - name: currency
          match: [ "currency" ]
          description: "ISO 4217 sayisal para birimi kodu"
          pattern: "^[0-9]{3}$"
          examples: [ "949", "978", "840" ]

        - name: shortNumber
          match: [ "shortnumber", "smscshortnumber", "servicenumber" ]
          description: "Kisa servis numarasi, 3 ile 5 hane arasi"
          pattern: "^[0-9]{3,5}$"
          examples: [ "7979", "2525" ]

        - name: imsi
          match: [ "imsi", "imsicurrent", "imsinew" ]
          description: "Turkiye MCC 286 ve MNC 01-04 ile baslayan 15 haneli IMSI"
          pattern: "^286(01|02|03|04)[0-9]{10}$"
          examples: [ "286016640426689", "286012345678901" ]

        - name: imei
          match: [ "imei", "equipmentid" ]
          description: "15 haneli cihaz kimligi"
          pattern: "^[0-9]{15}$"
          examples: [ "353908156170760" ]

        - name: millisecondsFraction
          match: [ "fraction" ]
          description: "Milliseconds ::= INTEGER (0..999): saniyenin kesri, TAM ZAMAN DEGIL. 0-999 arasi duz sayi."
          pattern: "^[0-9]{1,3}$"
          examples: [ "0", "125", "999" ]

        - name: timestamp
          match: [ "timestamp", "starttime", "endtime", "openingtime", "closuretime", "eventtime", "triggertime" ]
          description: "14 hane ise yyyyMMddHHmmss, 12 hane ise yyMMddHHmmss; 2026 icinde son 30 gun"
          pattern: "^[0-9]{12,14}$"
          examples: [ "20260711050243", "260711050243" ]

        - name: date
          match: [ "date", "receiveddate", "expirydate", "startdate" ]
          description: "yyyyMMdd formatinda tarih"
          pattern: "^[0-9]{8}$"
          examples: [ "20260711" ]

        - name: duration
          match: [ "duration", "callduration" ]
          description: "Saniye cinsinden sure; sesli cagri icin 1-3600 arasi"
          pattern: "^[0-9]{1,6}$"
          examples: [ "15", "127", "842" ]

        - name: volume
          match: [ "volume", "octets", "uplink", "downlink", "datavolume" ]
          description: "Byte cinsinden veri hacmi"
          pattern: "^[0-9]{1,12}$"
          examples: [ "1048576", "52428800" ]

        - name: ipAddress
          match: [ "ipaddress", "ipv4", "sgsnaddress", "ggsnaddress", "pdpaddress", "gsnaddress" ]
          description: "Ozel ag IPv4 adresi"
          pattern: "^(10|172|192)\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$"
          examples: [ "10.219.22.197" ]

        - name: accessPointName
          match: [ "accesspointname", "apn" ]
          description: "Erisim noktasi adi (APN)"
          pattern: "^[a-zA-Z0-9.]+$"
          examples: [ "internet", "mms.turkcell.com.tr", "ims" ]
          octet-string-content: text

        - name: pdpType
          match: [ "pdptype" ]
          description: "PDP tipi kodu"
          pattern: "^(IP|PPP|IPV6|IPV4V6)$"
          examples: [ "IP", "IPV6" ]

        - name: cellId
          match: [ "cellid", "cellidentifier", "locationarea", "trackingarea", "servicearea", "locationrout" ]
          description: "Sabit uzunlukta hucre veya alan kimligi (binary hex formatinda)"
          pattern: "^[0-9a-fA-F]{4,20}$"
          examples: [ "4125", "0001", "12345a" ]
          octet-string-content: binary

        - name: latitude
          match: [ "latitude" ]
          description: "Turkiye sinirlari icinde enlem, 35.8 ile 42.1 arasi"
          pattern: "^(3[5-9]|4[0-2])\\.[0-9]{1,6}$"
          examples: [ "41.015137", "38.423733" ]

        - name: longitude
          match: [ "longitude" ]
          description: "Turkiye sinirlari icinde boylam, 25.9 ile 44.8 arasi"
          pattern: "^(2[6-9]|3[0-9]|4[0-4])\\.[0-9]{1,6}$"
          examples: [ "28.979530", "35.243322" ]

        - name: ipAddress
          match: [ "ipaddress", "ipv4" ]
          description: "Ozel ag IPv4 adresi"
          pattern: "^(10|172|192)\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$"
          examples: [ "10.219.22.197" ]

        - name: hostName
          match: [ "hostname", "originhostname", "domainname" ]
          description: "Sunucu veya alan adi"
          pattern: "^[a-zA-Z0-9.-]+$"
          examples: [ "host01.turkcell.com.tr", "ims.mnc001.mcc286.3gppnetwork.org" ]
          octet-string-content: text

        - name: booleanFlag
          match: [ "flag", "realmoneyflag", "isvowifi", "isvideo", "welcomestatus" ]
          description: "0 veya 1 degerinde sayisal bayrak"
          pattern: "^(0|1)$"
          examples: [ "0", "1" ]

        - name: sequenceNumber
          match: [ "sequence", "sequencenumber", "recordnumber", "localsequencenumber" ]
          description: "Artan sira numarasi"
          pattern: "^[0-9]{1,10}$"
          examples: [ "295043" ]

        # --------------------------------------------------------------
        # MMTel/IMS alanlari. Bicimler EMM'in KABUL ETTIGI referans
        # yakalamadan cikarildi; ornek DEGERLER sentetiktir - referans
        # gercek abone verisi tasidigi icin numaralar kopyalanmadi.
        # --------------------------------------------------------------

        - name: sipUri
          match: [ "sip-uri" ]
          description: "SIP URI (RFC 3261): sip:+90<10 hane>@ims.mnc001.mcc286.3gppnetwork.org"
          pattern: "^sip:.+@.+$"
          examples: [ "sip:+905321112233@ims.mnc001.mcc286.3gppnetwork.org",
                      "sip:+905428063330@ims.mnc001.mcc286.3gppnetwork.org" ]

        - name: telUri
          match: [ "tel-uri" ]
          description: "TEL URI (RFC 3966): tel:+ ile baslayan Turkiye numarasi"
          pattern: "^tel:\\+?[0-9]{10,15}$"
          examples: [ "tel:+905321112233", "tel:+905428063330" ]

        - name: sipMethod
          match: [ "sip-method" ]
          description: "SIP istek metodu, buyuk harf"
          pattern: "^[A-Z]{3,12}$"
          examples: [ "INVITE", "MESSAGE", "SUBSCRIBE" ]

        - name: sessionId
          match: [ "session-id", "sessionid" ]
          description: "IMS oturum kimligi; tire ile ayrilmis onaltilik bloklar"
          pattern: "^[A-Za-z0-9@._-]{8,80}$"
          examples: [ "FA163E2C03F1-150a-ef7c9700-4abdc2-6925e8d0-b3a1f",
                      "FA163EA68A0A-19b5-4a3cd700-1f2cb5-6925e8d0-4d85a" ]

        - name: imsChargingIdentifier
          match: [ "charging-identifier" ]
          description: "IMS Charging Identifier (ICID): <dugum>.<realm>-<rakamlar>"
          pattern: "^[A-Za-z0-9._-]+$"
          examples: [ "GBTEST1.ims.mnc001.mcc286.3gppnetwork.org-061481617640921112624" ]
          octet-string-content: text

        - name: accessNetworkInformation
          match: [ "accessnetworkinformation", "lastknownpani" ]
          description: "3GPP P-Access-Network-Info basligi (PANI)"
          pattern: "^3GPP-[A-Za-z0-9-]+;.*$"
          examples: [ "3GPP-E-UTRAN-FDD;utran-cell-id-3gpp=286011234567890;network-provided",
                      "3GPP-UTRAN-FDD;utran-cell-id-3gpp=28601abc1" ]

        - name: nodeId
          match: [ "node-id" ]
          description: "Uretici dugum kimligi"
          pattern: "^[A-Za-z0-9_-]+$"
          examples: [ "vIMS_Mobile_TEST-01-1001", "vIMS_Mobile_TEST-13-3033" ]
          octet-string-content: text

        - name: networkIdentifier
          match: [ "visitednetworkidentifier", "originatingioi", "terminatingioi" ]
          description: "IMS ag alan adi (3GPP realm)"
          pattern: "^[a-z0-9.]+$"
          examples: [ "ims.mnc001.mcc286.3gppnetwork.org" ]
          octet-string-content: text

        - name: serviceContextId
          match: [ "servicecontextid" ]
          description: "3GPP Service-Context-Id"
          pattern: "^[0-9.]+@[a-z0-9.]+$"
          examples: [ "10.32275@3gpp.org" ]

        - name: gsmaInstanceId
          match: [ "instanceid" ]
          description: "GSMA IMEI URN"
          pattern: "^urn:gsma:imei:[0-9-]+$"
          examples: [ "urn:gsma:imei:35360612-345678-0" ]

        - name: userAgent
          match: [ "useragent" ]
          description: "SIP User-Agent basligi"
          pattern: "^[A-Za-z0-9/. _-]+$"
          examples: [ "VoLTE/WFC UA" ]
          octet-string-content: text

        # Referans yakalamada bu alanin baytlari '3831383231...'H, yani
        # "81821600d0eaef0d" metninin ASCII karsiligi - onaltilik GORUNEN ama
        # metin olarak tasinan bir kimlik. EMM'den gecen P5 de boyle uretmisti.
        - name: userLocationInformation
          match: [ "userlocationinformation" ]
          description: "ECGI/CGI: kucuk harf onaltilik METIN (16 hane)"
          pattern: "^[0-9a-f]{12,16}$"
          examples: [ "81821600d0c11e0c", "81821600d0eaef0d" ]
          octet-string-content: text

        # cgiInformation semada IA5String'dir, OCTET STRING degil - bu yuzden
        # octet-string-content ayarinin burada bir karsiligi olmaz.
        - name: cgiInformation
          match: [ "cgiinformation" ]
          description: "CGI/ECGI onaltilik metin"
          pattern: "^[0-9a-f]{12,16}$"
          examples: [ "821600d0c11e0c", "13006222b63abc" ]

        - name: sdpMediaName
          match: [ "media-name", "medianame" ]
          description: "SDP m= satiri"
          pattern: "^m=[a-z]+ [0-9]+ [A-Za-z0-9/ ]+$"
          examples: [ "m=audio 49152 RTP/AVP 98 105", "m=video 51372 RTP/AVP 99" ]

        - name: subscriberIdentityDigits
          match: [ "subscriptioniddata", "addressdigit", "vplmnid" ]
          description: "Abone tanimlayici rakam dizisi (MSISDN/IMSI), duz rakam"
          pattern: "^[0-9]{10,15}$"
          examples: [ "905321112233", "905428063330" ]

logging:
  level:
    com.turkcell.cdrgenerator1: DEBUG
  file:
    name: logs/cdr-generator.log

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs